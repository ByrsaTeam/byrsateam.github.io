<style>
:root{--bg:#f6f7ff;--card:#fff;--tx:#1b1f3b;--mu:#5d637f;--pr:#5b5bf5;--gr:#16b97a;--bd:#e3e5f8;--sh:0 10px 30px #5b5bf51f}
:root[data-t=dark]{--bg:#0d0f24;--card:#161a38;--tx:#eef0ff;--mu:#9aa0c7;--bd:#262b57;--sh:0 10px 30px #0008}
*{box-sizing:border-box;margin:0}html{scroll-behavior:smooth}
body{font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,Tahoma,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:84px}
a{color:inherit;text-decoration:none}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:10px 16px;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--bd)}
header b{display:flex;align-items:center;gap:8px}header img{width:30px}.bt{display:flex;align-items:center;gap:8px;margin-inline-end:auto;padding:6px 12px;border:1px solid var(--bd);border-radius:12px;background:var(--card);font-weight:700;white-space:nowrap}.bt img{width:22px}
select,.ic{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:7px 9px;font:inherit;cursor:pointer}

.btn:hover{transform:translateY(-2px) scale(1.03)}.btn.s{padding:8px 14px;font-size:14px}
.hero{text-align:center;padding:48px 20px 40px;max-width:900px;margin:auto;position:relative}
.orb{position:relative;width:200px;height:200px;margin:0 auto 24px;display:grid;place-items:center}
.orb img{width:120px;z-index:2;animation:fl 4s ease-in-out infinite;filter:drop-shadow(0 10px 20px #5b5bf588)}
.orb i{position:absolute;inset:0;border-radius:50%;border:2px solid var(--pr);opacity:0;animation:rp 3.6s infinite}

.orb em{position:absolute;inset:0;font-style:normal;animation:sp 14s linear infinite}
.orb em span{position:absolute;font-size:24px;background:var(--card);border-radius:50%;width:42px;height:42px;display:grid;place-items:center;box-shadow:var(--sh);animation:sp 14s linear infinite reverse}
.orb em span:nth-child(1){top:-12px;left:79px}.orb em span:nth-child(2){bottom:-12px;left:79px}.orb em span:nth-child(3){top:79px;left:-12px}.orb em span:nth-child(4){top:79px;right:-12px}

.pill{display:inline-block;padding:6px 14px;border-radius:99px;background:var(--card);border:1px solid var(--bd);color:var(--pr);font-weight:600;font-size:14px;margin-bottom:16px}
h1{text-wrap:balance;font-size:clamp(28px,6vw,52px);line-height:1.15;background:linear-gradient(90deg,var(--pr),#a15cf6,var(--gr));-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:16px}
.sub{color:var(--mu);font-size:18px;max-width:640px;margin:0 auto 24px}.tr{color:var(--mu);font-size:14px;margin-top:14px}

.stat,.card,.plan{background:var(--card);border:1px solid var(--bd);border-radius:20px;box-shadow:var(--sh)}

section{max-width:1000px;margin:auto;padding:56px 20px 0}h2{text-align:center;font-size:clamp(24px,4vw,34px);margin-bottom:28px}

.plan{padding:26px}.plan h3{margin-bottom:12px}.plan li{list-style:none;padding:5px 0}.plan li:before{content:"✓ ";color:var(--gr);font-weight:700}
.lt{border:2px solid var(--pr);position:relative;background:linear-gradient(160deg,var(--card),color-mix(in srgb,var(--pr) 12%,var(--card)))}
.price{font-size:22px;font-weight:800;color:var(--pr);margin-bottom:10px}
.warn{margin-top:16px;padding:12px 14px;border-radius:12px;background:#f59e0b22;border-inline-start:4px solid #f59e0b;font-size:14px}

.note{text-align:center;color:var(--mu);margin-top:20px}
.fin{text-align:center;padding:64px 20px}.fin h2{margin-bottom:20px}
footer{text-align:center;color:var(--mu);font-size:14px;padding:0 20px 24px}footer a{margin:0 8px;text-decoration:underline}
.bar{position:fixed;inset:auto 0 0 0;z-index:30;display:flex;justify-content:center;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--bd)}
.rv{opacity:0;transform:translateY(24px);transition:.7s}.rv.on{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}

tr:["%100 çevrimdışı · Tasarımdan gizli","Banka kadar güçlü. Günlüğünüz kadar özel.","Cihazda yapay zekâ, sıfır tabanlı bütçe ve Zen Score ile ücretsiz bütçe. Hesap yok, bulut yok, takip yok.","Google Play'den ücretsiz indir","Sonsuza dek ücretsiz · Reklamsız · Sınırsız işlem","Sunucu|Yerel YZ|Dil|İşlem","Neden BudgetZen","🧠::Cihazda YZ::Analiz ve tahminler telefonunuzda çalışır.|⚖️::Sıfır Tabanlı Bütçe::Her liraya bir görev. Tek dokunuşla 50/30/20.|📋::Klasik Mod::Ani artışları ve gizli abonelikleri yakalar.|🏆::Zen Score::20 rozetle finansal sağlığınızı oyunlaştırın.|🏦::CSV İçe Aktarma::Riskli banka senkronu yok. Yerel kategorileme.|📊::Grafik ve Hedefler::Güzel grafikler, proje simülatörü.|🔌::%100 yerel, internet gerekmez::İnternet bağlantısı, hesap ve reklam yok. Her şey cihazınızda kalır.|👨‍👩‍👧::Aile paylaşımı::Bütçeleri aileyle şifreli dosyalarla paylaşın. Bulut yok.|🧠::Kişisel finans koçu::Cihazda YZ içgörüleri ve haftalık kişisel özet, her para kararında yol gösterir.","Ücretsiz","Sınırsız işlem ve bütçe|Sıfır tabanlı ve klasik mod|Yerel YZ içgörüleri|Zen Score + 3 rozet|CSV banka aktarımı","💎 Sınırlı Ömür Boyu Premium","$59,99 tek seferlik · Abonelik yok · En iyi değer","20 Zen Score rozetinin tümü|Gelişmiş grafikler ve bakiye eğrisi|Aylık PDF raporlar|Şifreli aile paylaşımı|Tam haftalık koç","⚠️ Her lansman dalgasında sınırlı adet. Tükenip sonra yeniden açılabilir. Uygulamadaki Premium ekranında (Google Play satın alma).","Premium bir tercihtir, zorunluluk değil. Temel özellikler süresiz ücretsiz kalır.","Özel finans günlüğünüz şimdi başlıyor.","Yasal"],
ja:["100%オフライン・設計段階からプライベート","銀行のように強力。日記のように秘密。","端末内AI、ゼロベース予算、Zen Scoreを備えた無料の家計簿。アカウント・クラウド・追跡は一切なし。","Google Playで無料ダウンロード","ずっと無料・広告なし・取引数無制限","サーバー|端末内AI|言語|取引","BudgetZenが選ばれる理由","🧠::端末内AI::分析と予測はすべてスマホ内で完結。|⚖️::ゼロベース予算::1円ごとに役割を。ワンタップで50/30/20。|📋::クラシックモード::急な出費や隠れたサブスクを検出。|🏆::Zen Score::20個のバッジで家計管理をゲーム感覚に。|🏦::CSVインポート::危険な銀行連携なし。端末内で自動分類。|📊::グラフと目標::美しいグラフとプロジェクトシミュレーター。|🔌::100%ローカル、ネット不要::インターネット接続、アカウント、広告は一切不要。すべてが端末内に残ります。|👨‍👩‍👧::ファミリー共有::暗号化ファイルで家族と予算を共有。クラウドは使いません。|🧠::パーソナルファイナンスコーチ::端末内AIのインサイトと週次の個人サマリーが、お金の判断を導きます。","無料","取引・予算は無制限|ゼロベース＆クラシックモード|端末内AIインサイト|Zen Score＋スターターバッジ3個|銀行CSVインポート","💎 数量限定 買い切りプレミアム","$59.99 一回払い・サブスクなし・最もお得","Zen Scoreバッジ全20個|高度なグラフと残高推移曲線|月次PDFレポート|暗号化ファミリー共有|週次コーチの全機能","⚠️ 発売ウェーブごとに数量限定です。売り切れ後、再開される場合があります。アプリ内のプレミアム画面から購入できます（Google Play課金）。","プレミアムはあくまで選択肢で、義務ではありません。基本機能は期限なしで無料です。","あなただけの家計日記を、今すぐ。","法的情報"],
ko:["100% 오프라인 · 설계부터 프라이빗","은행만큼 강력하게. 일기장만큼 은밀하게.","기기 내 AI, 제로베이스 예산, Zen Score를 갖춘 무료 가계부. 계정, 클라우드, 추적이 없습니다.","Google Play에서 무료 다운로드","영원히 무료 · 광고 없음 · 거래 무제한","서버|기기 내 AI|언어|거래","BudgetZen을 선택하는 이유","🧠::기기 내 AI::분석과 예측이 모두 내 휴대폰에서 실행됩니다.|⚖️::제로베이스 예산::모든 돈에 역할을. 한 번에 50/30/20.|📋::클래식 모드::급증 지출과 숨은 구독을 찾아냅니다.|🏆::Zen Score::배지 20개로 재정 건강을 게임처럼.|🏦::CSV 가져오기::위험한 은행 연동 없이 기기 내 자동 분류.|📊::차트와 목표::아름다운 차트와 프로젝트 시뮬레이터.|🔌::100% 로컬, 인터넷 불필요::인터넷 연결도, 계정도, 광고도 필요 없습니다. 모든 것이 기기 안에 남습니다.|👨‍👩‍👧::가족 공유::암호화된 파일로 가족과 예산을 공유하세요. 클라우드는 사용하지 않습니다.|🧠::개인 재정 코치::기기 내 AI 인사이트와 주간 개인 요약이 모든 돈 결정을 도와줍니다.","무료","거래·예산 무제한|제로베이스 및 클래식 모드|기기 내 AI 인사이트|Zen Score + 기본 배지 3개|은행 CSV 가져오기","💎 한정 평생 프리미엄","$59.99 일회성 결제 · 구독 없음 · 최고의 가치","Zen Score 배지 전체 20개|고급 차트와 잔액 추이 곡선|월간 PDF 리포트|암호화된 가족 공유|주간 코치 전체 기능","⚠️ 출시 웨이브마다 한정 수량입니다. 품절 후 다시 열릴 수 있습니다. 앱 내 프리미엄 화면에서 확인하세요 (Google Play 인앱 결제).","프리미엄은 선택일 뿐 의무가 아닙니다. 핵심 기능은 기간 제한 없이 무료입니다.","나만의 프라이빗 재정 일기, 지금 시작하세요.","법적 고지"]};

en:["Inside the app","Every feature, in detail","No automatic categorization::You cannot consciously manage your money without relaxing, noting it down, and understanding it.","🔒::100% Local & Private::Data stays on your device, AES-encrypted. No servers, no account, no ads, no tracking.|♾️::Unlimited Transactions & Budgets::No artificial limits, even in the free version.|⚖️::Zero-Based Budgeting::Give every dollar a job, with a live counter and 1-tap 50/30/20.|📋::Classic Budget Mode::Track as you go with spike detection and end-of-month prediction.|🧠::On-Device AI Insights::12 local insight types: spending velocity, hidden recurring payments, deficit alerts. Weekly free, daily with Premium|📊::Advanced Charts::Pie, 7-day bar, balance evolution curve and income vs. expenses dual bar|🚀::Project Simulator::Plan a home, car, trip or studies with feasibility scores and risk analysis. Unlimited projects|🎯::Quick Goal Tracker::Set a target, see progress and the monthly amount needed.|🔔::Recurring Reminders::Push notifications for bills, subscriptions and salaries.|🏦::CSV Import / Export::Bank statements auto-categorized. Export to CSV, JSON, TXT or PDF.|🏆::Zen Score & 20 Badges::Financial health score from Beginner to Zen Master. All 20 badges|📅::Weekly Financial Coach::A personal weekly summary, with savings opportunities|📄::Monthly PDF Report::Charts, budget tables, project progress and AI insights.|👨‍👩‍👧::Family Sharing::Encrypted .bz files, pure local encryption, no cloud.|🌍::60+ Currencies · 10 Languages::Light and dark theme, with full right-to-left support."],
fr:["Dans l'application","Toutes les fonctionnalités en détail","Pas de catégorisation automatique::On ne peut pas gérer consciemment son argent sans se détendre, le noter et le comprendre.","🔒::100 % local et privé::Données sur votre appareil, chiffrées AES. Sans serveur, compte, pub ni suivi.|♾️::Transactions et budgets illimités::Aucune limite artificielle, même en version gratuite.|⚖️::Budget base zéro::Un rôle pour chaque euro, avec compteur en direct et 50/30/20 en 1 tap.|📋::Mode budget classique::Suivi au fil de l'eau, détection de pics et prévision de fin de mois.|🧠::IA locale::12 types d'analyses : rythme de dépenses, paiements récurrents cachés, alertes de déficit. Hebdo gratuit, quotidien en Premium|📊::Graphiques avancés::Camembert, barres 7 jours, courbe d'évolution du solde et revenus vs dépenses|🚀::Simulateur de projets::Maison, voiture, voyage, études : faisabilité et analyse des risques. Projets illimités|🎯::Objectif rapide::Fixez une cible, suivez la progression et le montant mensuel requis.|🔔::Rappels récurrents::Notifications pour factures, abonnements et salaires.|🏦::Import / export CSV::Relevés bancaires catégorisés automatiquement. Export CSV, JSON, TXT ou PDF.|🏆::Zen Score et 20 badges::Score de santé financière de Débutant à Maître Zen. Les 20 badges|📅::Coach financier hebdo::Un résumé hebdomadaire personnel, avec pistes d'économies|📄::Rapport PDF mensuel::Graphiques, tableaux de budget, projets et analyses IA.|👨‍👩‍👧::Partage familial::Fichiers .bz chiffrés, chiffrement 100 % local, sans cloud.|🌍::60+ devises · 10 langues::Thème clair et sombre, avec support complet de la lecture de droite à gauche."],
de:["In der App","Alle Funktionen im Detail","Keine automatische Kategorisierung::Man kann sein Geld nicht bewusst verwalten, ohne sich zu entspannen, es aufzuschreiben und zu verstehen.","🔒::100 % lokal & privat::Daten bleiben auf Ihrem Gerät, AES-verschlüsselt. Keine Server, kein Konto, keine Werbung, kein Tracking.|♾️::Unbegrenzte Transaktionen & Budgets::Keine künstlichen Limits, auch kostenlos.|⚖️::Zero-Based-Budget::Jeder Euro bekommt einen Job, mit Live-Zähler und 50/30/20 per Tap.|📋::Klassischer Budgetmodus::Laufend erfassen, mit Ausreißer-Erkennung und Monatsendprognose.|🧠::KI-Einblicke auf dem Gerät::12 lokale Analysearten: Ausgabentempo, versteckte Abos, Defizitwarnungen. Wöchentlich gratis, täglich mit Premium|📊::Erweiterte Diagramme::Kreis, 7-Tage-Balken, Saldokurve und Einnahmen vs. Ausgaben|🚀::Projektsimulator::Haus, Auto, Reise oder Studium planen: Machbarkeit und Risikoanalyse. Unbegrenzte Projekte|🎯::Schnellziel::Ziel setzen, Fortschritt sehen und den nötigen Monatsbetrag erfahren.|🔔::Wiederkehrende Erinnerungen::Push-Mitteilungen für Rechnungen, Abos und Gehalt.|🏦::CSV-Import / Export::Kontoauszüge automatisch kategorisiert. Export als CSV, JSON, TXT oder PDF.|🏆::Zen Score & 20 Badges::Finanz-Gesundheitswert vom Anfänger zum Zen-Meister. Alle 20 Badges|📅::Wöchentlicher Finanz-Coach::Persönliche Wochenzusammenfassung mit Sparchancen|📄::Monatlicher PDF-Bericht::Diagramme, Budgettabellen, Projektfortschritt und KI-Einblicke.|👨‍👩‍👧::Familienfreigabe::Verschlüsselte .bz-Dateien, rein lokale Verschlüsselung, keine Cloud.|🌍::60+ Währungen · 10 Sprachen::Helles und dunkles Design, mit vollständiger Rechts-nach-links-Unterstützung."],
es:["Dentro de la app","Todas las funciones al detalle","Sin categorización automática::No puedes gestionar tu dinero con conciencia sin relajarte, anotarlo y entenderlo.","🔒::100% local y privado::Datos en tu dispositivo, cifrados AES. Sin servidores, cuenta, anuncios ni rastreo.|♾️::Transacciones y presupuestos ilimitados::Sin límites artificiales, ni siquiera gratis.|⚖️::Presupuesto base cero::Cada dólar con un trabajo, con contador en vivo y 50/30/20 en 1 toque.|📋::Modo presupuesto clásico::Registra sobre la marcha con detección de picos y predicción de fin de mes.|🧠::Análisis IA en el dispositivo::12 tipos de análisis: ritmo de gasto, pagos recurrentes ocultos, alertas de déficit. Semanal gratis, diario con Premium|📊::Gráficos avanzados::Circular, barras de 7 días, curva de saldo e ingresos vs. gastos|🚀::Simulador de proyectos::Casa, coche, viaje o estudios: viabilidad y análisis de riesgo. Proyectos ilimitados|🎯::Meta rápida::Fija un objetivo, mira el progreso y el importe mensual necesario.|🔔::Recordatorios recurrentes::Notificaciones para facturas, suscripciones y nóminas.|🏦::Importar / exportar CSV::Extractos bancarios categorizados automáticamente. Exporta a CSV, JSON, TXT o PDF.|🏆::Zen Score y 20 insignias::Puntuación de salud financiera de Principiante a Maestro Zen. Las 20 insignias|📅::Coach financiero semanal::Resumen semanal personal con oportunidades de ahorro|📄::Informe PDF mensual::Gráficos, tablas de presupuesto, progreso de proyectos y análisis IA.|👨‍👩‍👧::Compartir en familia::Archivos .bz cifrados, cifrado 100% local, sin nube.|🌍::60+ monedas · 10 idiomas::Tema claro y oscuro, con soporte completo de derecha a izquierda."],
it:["Dentro l'app","Tutte le funzioni nel dettaglio","Nessuna categorizzazione automatica::Non puoi gestire consapevolmente il tuo denaro senza rilassarti, annotarlo e comprenderlo.","🔒::100% locale e privato::Dati sul tuo dispositivo, cifrati AES. Niente server, account, pubblicità o tracciamento.|♾️::Transazioni e budget illimitati::Nessun limite artificiale, anche gratis.|⚖️::Budget base zero::Ogni euro ha un compito, con contatore live e 50/30/20 in 1 tap.|📋::Modalità budget classica::Registra al volo con rilevamento picchi e previsione di fine mese.|🧠::Analisi IA sul dispositivo::12 tipi di analisi: ritmo di spesa, pagamenti ricorrenti nascosti, avvisi di deficit. Settimanale gratis, giornaliero con Premium|📊::Grafici avanzati::A torta, a barre 7 giorni, curva del saldo ed entrate vs. uscite|🚀::Simulatore di progetti::Casa, auto, viaggio o studi: fattibilità e analisi dei rischi. Progetti illimitati|🎯::Obiettivo rapido::Imposta un traguardo, vedi i progressi e l'importo mensile necessario.|🔔::Promemoria ricorrenti::Notifiche per bollette, abbonamenti e stipendi.|🏦::Import / export CSV::Estratti conto categorizzati automaticamente. Esporta in CSV, JSON, TXT o PDF.|🏆::Zen Score e 20 badge::Punteggio di salute finanziaria da Principiante a Maestro Zen. Tutti i 20 badge|📅::Coach finanziario settimanale::Riepilogo settimanale personale con opportunità di risparmio|📄::Report PDF mensile::Grafici, tabelle di budget, avanzamento progetti e analisi IA.|👨‍👩‍👧::Condivisione familiare::File .bz cifrati, cifratura 100% locale, senza cloud.|🌍::60+ valute · 10 lingue::Tema chiaro e scuro, con pieno supporto da destra a sinistra."],
pt:["Dentro do app","Todos os recursos em detalhe","Sem categorização automática::Você não consegue gerir seu dinheiro com consciência sem relaxar, anotar e entender.","🔒::100% local e privado::Dados no seu aparelho, criptografados AES. Sem servidores, conta, anúncios ou rastreamento.|♾️::Transações e orçamentos ilimitados::Sem limites artificiais, mesmo no plano grátis.|⚖️::Orçamento base zero::Cada real com uma função, com contador ao vivo e 50/30/20 em 1 toque.|📋::Modo orçamento clássico::Registre no dia a dia com detecção de picos e previsão de fim de mês.|🧠::Análises de IA no aparelho::12 tipos de análise: ritmo de gastos, pagamentos recorrentes ocultos, alertas de déficit. Semanal grátis, diário com Premium|📊::Gráficos avançados::Pizza, barras de 7 dias, curva de saldo e receitas vs. despesas|🚀::Simulador de projetos::Casa, carro, viagem ou estudos: viabilidade e análise de risco. Projetos ilimitados|🎯::Meta rápida::Defina um alvo, veja o progresso e o valor mensal necessário.|🔔::Lembretes recorrentes::Notificações para contas, assinaturas e salários.|🏦::Importar / exportar CSV::Extratos bancários categorizados automaticamente. Exporte em CSV, JSON, TXT ou PDF.|🏆::Zen Score e 20 medalhas::Pontuação de saúde financeira de Iniciante a Mestre Zen. Todas as 20 medalhas|📅::Coach financeiro semanal::Resumo semanal pessoal com oportunidades de economia|📄::Relatório PDF mensal::Gráficos, tabelas de orçamento, progresso de projetos e análises de IA.|👨‍👩‍👧::Compartilhamento familiar::Arquivos .bz criptografados, criptografia 100% local, sem nuvem.|🌍::60+ moedas · 10 idiomas::Tema claro e escuro, com suporte completo da direita para a esquerda."],
ja:["アプリの機能","すべての機能を詳しく","自動分類はしません::リラックスして、書き留めて、理解することなしに、お金を意識的に管理することはできません。","🔒::100%ローカル＆プライベート::データは端末内にAES暗号化で保存。サーバー、アカウント、広告、追跡なし。|♾️::取引・予算は無制限::無料版でも人為的な制限はありません。|⚖️::ゼロベース予算::1円ごとに役割を。リアルタイムのカウンターとワンタップ50/30/20。|📋::クラシック予算モード::記録しながら、急な出費の検出と月末残高の予測。|🧠::端末内AIインサイト::支出ペース、隠れた定期支払い、赤字アラートなど12種類。週次は無料、毎日はプレミアム|📊::高度なグラフ::円グラフ、7日間の棒グラフ、残高推移曲線、収支の二重棒グラフ|🚀::プロジェクトシミュレーター::住宅、車、旅行、学費を実現可能性とリスク分析で計画。無制限のプロジェクト|🎯::クイック目標::目標を設定し、進捗と毎月必要な金額を確認。|🔔::定期通知::請求、サブスク、給与のプッシュ通知。|🏦::CSVインポート／エクスポート::銀行明細を自動分類。CSV、JSON、TXT、PDFで出力。|🏆::Zen Scoreと20個のバッジ::初心者からZenマスターまでの家計健康スコア。全20個のバッジ|📅::週次ファイナンスコーチ::節約のヒント付きの週次サマリー|📄::月次PDFレポート::グラフ、予算表、プロジェクトの進捗、AIインサイト。|👨‍👩‍👧::ファミリー共有::暗号化された.bzファイル。完全ローカル暗号化でクラウド不使用。|🌍::60以上の通貨・10言語::ライト／ダークテーマ、右から左の表示にも完全対応。"],
ar:["داخل التطبيق","كل الميزات بالتفصيل","بلا تصنيف تلقائي::لا يمكنك إدارة أموالك بوعي دون أن تهدأ وتدوّنها وتفهمها.","🔒::محلي وخاص 100%::بياناتك على جهازك ومشفرة بـ AES. بلا خوادم أو حساب أو إعلانات أو تتبع.|♾️::معاملات وميزانيات غير محدودة::بلا حدود مصطنعة حتى في النسخة المجانية.|⚖️::ميزانية الصفر::لكل دولار مهمة، مع عداد مباشر وتوزيع 50/30/20 بنقرة.|📋::وضع الميزانية الكلاسيكي::تتبّع أولاً بأول مع كشف القفزات وتوقع رصيد نهاية الشهر.|🧠::تحليلات ذكية على الجهاز::12 نوع تحليل: وتيرة الإنفاق، المدفوعات المتكررة الخفية، تنبيهات العجز. أسبوعي مجاناً ويومي مع بريميوم|📊::رسوم متقدمة::دائري، أعمدة 7 أيام، منحنى الرصيد والإيرادات مقابل المصروفات|🚀::محاكي المشاريع::خطط لمنزل أو سيارة أو سفر أو دراسة مع جدوى وتحليل مخاطر. مشاريع غير محدودة|🎯::هدف سريع::حدد هدفاً وتابع التقدم والمبلغ الشهري المطلوب.|🔔::تذكيرات متكررة::إشعارات للفواتير والاشتراكات والرواتب.|🏦::استيراد / تصدير CSV::كشوف البنك تُصنَّف تلقائياً. تصدير إلى CSV وJSON وTXT وPDF.|🏆::Zen Score و20 شارة::درجة الصحة المالية من مبتدئ إلى معلم Zen. كل الشارات الـ20|📅::مدرب مالي أسبوعي::ملخص أسبوعي شخصي مع فرص للتوفير|📄::تقرير PDF شهري::رسوم وجداول ميزانية وتقدم المشاريع وتحليلات ذكية.|👨‍👩‍👧::مشاركة عائلية::ملفات .bz مشفرة، تشفير محلي بالكامل بلا سحابة.|🌍::أكثر من 60 عملة · 10 لغات::مظهر فاتح وداكن مع دعم كامل للكتابة من اليمين إلى اليسار."],
ko:["앱 기능","모든 기능을 자세히","자동 분류 없음::마음을 편히 하고, 기록하고, 이해하지 않고서는 돈을 의식적으로 관리할 수 없습니다.","🔒::100% 로컬 & 프라이빗::데이터는 기기 안에 AES로 암호화되어 저장됩니다. 서버, 계정, 광고, 추적이 없습니다.|♾️::거래·예산 무제한::무료 버전에도 인위적인 제한이 없습니다.|⚖️::제로베이스 예산::모든 돈에 역할을. 실시간 카운터와 원탭 50/30/20.|📋::클래식 예산 모드::기록하면서 급증 지출 감지와 월말 잔액 예측.|🧠::기기 내 AI 인사이트::지출 속도, 숨은 정기 결제, 적자 경고 등 12가지 분석. 주간은 무료, 매일은 프리미엄|📊::고급 차트::원형, 7일 막대, 잔액 추이 곡선, 수입 vs 지출 이중 막대|🚀::프로젝트 시뮬레이터::집, 자동차, 여행, 학업을 실현 가능성과 위험 분석으로 계획. 무제한 프로젝트|🎯::퀵 목표::목표를 정하고 진행 상황과 매월 필요한 금액을 확인하세요.|🔔::반복 알림::청구서, 구독, 급여 푸시 알림.|🏦::CSV 가져오기 / 내보내기::은행 내역을 자동 분류. CSV, JSON, TXT, PDF로 내보내기.|🏆::Zen Score와 배지 20개::초보자부터 Zen 마스터까지 재정 건강 점수. 배지 20개 모두|📅::주간 재정 코치::절약 기회를 담은 개인 주간 요약|📄::월간 PDF 리포트::차트, 예산표, 프로젝트 진행 상황, AI 인사이트.|👨‍👩‍👧::가족 공유::암호화된 .bz 파일, 클라우드 없는 완전 로컬 암호화.|🌍::60개 이상 통화 · 10개 언어::라이트/다크 테마, 오른쪽에서 왼쪽 표기 완전 지원."],
tr:["Uygulamanın içi","Tüm özellikler ayrıntılı","Otomatik kategorilendirme yok::Rahatlamadan, not almadan ve anlamadan paranızı bilinçli yönetemezsiniz.","🔒::%100 yerel ve gizli::Veriler cihazınızda, AES şifreli. Sunucu, hesap, reklam, takip yok.|♾️::Sınırsız işlem ve bütçe::Ücretsiz sürümde bile yapay sınır yok.|⚖️::Sıfır tabanlı bütçe::Her liraya bir görev; canlı sayaç ve tek dokunuşla 50/30/20.|📋::Klasik bütçe modu::Giderken takip; ani artış tespiti ve ay sonu tahmini.|🧠::Cihazda YZ içgörüleri::12 yerel analiz: harcama hızı, gizli yinelenen ödemeler, açık uyarıları. Haftalık ücretsiz, günlük Premium ile|📊::Gelişmiş grafikler::Pasta, 7 günlük çubuk, bakiye eğrisi ve gelir-gider çift çubuk|🚀::Proje simülatörü::Ev, araba, seyahat veya eğitim: uygulanabilirlik ve risk analizi. Sınırsız proje|🎯::Hızlı hedef::Hedef belirleyin, ilerlemeyi ve gereken aylık tutarı görün.|🔔::Yinelenen hatırlatıcılar::Fatura, abonelik ve maaş bildirimleri.|🏦::CSV içe / dışa aktarma::Banka ekstreleri otomatik kategorilenir. CSV, JSON, TXT veya PDF olarak dışa aktarın.|🏆::Zen Score ve 20 rozet::Başlangıçtan Zen Ustasına finansal sağlık puanı. 20 rozetin tümü|📅::Haftalık finans koçu::Tasarruf fırsatlarıyla kişisel haftalık özet|📄::Aylık PDF raporu::Grafikler, bütçe tabloları, proje ilerlemesi ve YZ içgörüleri.|👨‍👩‍👧::Aile paylaşımı::Şifreli .bz dosyaları, bulutsuz tam yerel şifreleme.|🌍::60+ para birimi · 10 dil::Açık ve koyu tema, sağdan sola yazım desteğiyle."]};
