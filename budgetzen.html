ko:["100% 오프라인 · 설계부터 프라이빗","은행만큼 강력하게. 일기장만큼 은밀하게.","기기 내 AI, 제로베이스 예산, Zen Score를 갖춘 무료 가계부. 계정, 클라우드, 추적이 없습니다.","Google Play에서 무료 다운로드","영원히 무료 · 광고 없음 · 거래 무제한","서버|기기 내 AI|언어|거래","BudgetZen을 선택하는 이유","🧠::AI 코치::분석과 예측이 모두 내 휴대폰에서 실행됩니다.|⚖️::제로베이스 예산::모든 돈에 역할을. 한 번에 50/30/20.|📋::클래식 모드::급증 지출과 숨은 구독을 찾아냅니다.|🏆::Zen Score::배지 20개로 재정 건강을 게임처럼.|🏦::CSV 가져오기::위험한 은행 연동 없이 기기 내 자동 분류.|📊::차트와 목표::아름다운 차트와 프로젝트 시뮬레이터.","무료","거래·예산 무제한|제로베이스 및 클래식 모드|기기 내 AI 인사이트|Zen Score + 기본 배지 3개|은행 CSV 가져오기","💎 한정 평생 프리미엄","$59.99 일회성 결제 · 구독 없음 · 최고의 가치","Zen Score 배지 전체 20개|고급 차트와 잔액 추이 곡선|월간 PDF 리포트|암호화된 가족 공유|주간 코치 전체 기능","⚠️ 출시 웨이브마다 한정 수량입니다. 품절 후 다시 열릴 수 있습니다. 앱 내 프리미엄 화면에서 확인하세요 (Google Play 인앱 결제).","프리미엄은 선택일 뿐 의무가 아닙니다. 핵심 기능은 기간 제한 없이 무료입니다.","나만의 프라이빗 재정 일기, 지금 시작하세요.","법적 고지"]};
